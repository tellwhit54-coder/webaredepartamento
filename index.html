<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Casa Techo Propio 3D</title>

  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #ffffff;
    }

    model-viewer {
      width: 100%;
      height: 100vh;
      background: #ffffff;
    }

    .ar-button {
      position: absolute;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      padding: 14px 24px;
      border: 2px solid #000000;
      border-radius: 30px;
      background: #ffffff;
      color: #000000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <model-viewer
    src="castilla_techo_propio_OBJ.glb"
    alt="Casa Techo Propio en 3D"
    camera-controls
    auto-rotate
    auto-rotate-delay="0"
    shadow-intensity="1"
    exposure="1"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor">

    <button
      slot="ar-button"
      class="ar-button">
      VER EN REALIDAD AUMENTADA
    </button>

  </model-viewer>

</body>
</html>
