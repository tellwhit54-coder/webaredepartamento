<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Departamento 3D</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    model-viewer {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>

<body>

  <model-viewer
    src="castilla_techo_propio_OBJ.glb"
    alt="Departamento en 3D"
    camera-controls
    auto-rotate
    ar
    ar-modes="webxr scene-viewer quick-look">
  </model-viewer>

</body>
</html>
