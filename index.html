<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Departamento 3D</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    model-viewer {
      width: 100%;
      height: 100vh;
      background-color: #ffffff;
    }

    .ar-button {
      background: #ffffff;
      border: 2px solid #000000;
      border-radius: 30px;
      padding: 14px 22px;
      font-size: 16px;
      font-weight: bold;
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      cursor: pointer;
    }
  </style>
</head>

<body>

  <model-viewer
    src="Castilla_techo_propio_OBJ.glb"
    alt="Departamento en 3D"
    camera-controls
    auto-rotate
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor">

    <button slot="ar-button" class="ar-button">
      VER EN REALIDAD AUMENTADA
    </button>

  </model-viewer>

</body>
</html>
